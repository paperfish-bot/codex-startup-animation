<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e6ef}
    video{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(.55) contrast(1.35) saturate(1.45)}
  </style>
</head>
<body>
  <video id="wallpaper-video" src="assets/wallpaper.mp4" poster="assets/artwork.jpg" muted loop playsinline preload="auto"></video>
  <script>
    const video=document.getElementById('wallpaper-video');
    window.wallpaperVideo=video;
    const settledTone='brightness(.55) contrast(1.35) saturate(1.45)';
    window.wallpaperReveal=()=>{
      video.currentTime=3.7;
      video.style.transition='none';
      video.style.filter='none';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        video.style.transition='filter 1180ms ease-in-out';
        video.style.filter=settledTone;
      }));
      video.play().catch(()=>{});
    };
    window.wallpaperSettle=()=>{video.style.transition='none';video.style.filter=settledTone;};
    const send=message=>window.chrome?.webview?.postMessage(message);
    video.addEventListener('loadeddata',()=>send('video-ready'),{once:true});
    video.addEventListener('playing',()=>send('video-playing'));
    video.addEventListener('playing',()=>setTimeout(()=>{
      const quality=video.getVideoPlaybackQuality?.();
      if(quality)send('video-quality:'+JSON.stringify({
        total:quality.totalVideoFrames,dropped:quality.droppedVideoFrames,
        time:+video.currentTime.toFixed(2)
      }));
    },5000),{once:true});
    video.addEventListener('error',()=>send('video-error'));
  </script>
</body>
</html>
